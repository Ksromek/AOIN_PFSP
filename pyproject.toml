[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfsp-aoin"
version = "0.1.0"
description = "PFSP + random keys: projekt AOIN (PWr)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "cma>=3.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
